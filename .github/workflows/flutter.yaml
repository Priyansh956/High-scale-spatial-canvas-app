name: Flutter CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2

      - working-directory: ./frontend/spatial_canvas_app

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk